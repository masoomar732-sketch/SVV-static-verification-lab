name: C/C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Compile game.cpp
      run: g++ -std=c++17 game.cpp -o game
      
    - name: Run Game
      run: ./game
